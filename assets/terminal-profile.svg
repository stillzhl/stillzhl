<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="650" viewBox="0 0 1320 650" role="img" aria-labelledby="title desc">
  <title id="title">Haili Zhang terminal profile</title>
  <desc id="desc">ASCII portrait derived from Haili Zhang's GitHub avatar beside a terminal-style engineering profile.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#101722"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#010409" flood-opacity=".58"/>
    </filter>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .portrait { fill: #8b949e; font-size: 14.5px; }
      .muted { fill: #6e7681; }
      .text { fill: #c9d1d9; }
      .blue { fill: #58a6ff; }
      .purple { fill: #bc8cff; }
      .green { fill: #3fb950; }
      .amber { fill: #d29922; }
    </style>
  </defs>

  <rect x="20" y="20" width="1280" height="610" rx="16" fill="url(#panel)" stroke="#30363d" filter="url(#shadow)"/>
  <circle cx="52" cy="51" r="6" fill="#ff7b72"/>
  <circle cx="74" cy="51" r="6" fill="#d29922"/>
  <circle cx="96" cy="51" r="6" fill="#3fb950"/>
  <text x="122" y="57" class="mono muted" font-size="15">haili@softwheel:~</text>
  <text x="1268" y="57" text-anchor="end" class="mono muted" font-size="14">ascii-profile --source github-avatar</text>
  <line x1="20" y1="78" x2="1300" y2="78" stroke="#30363d"/>

  <text x="52" y="106" class="mono green" font-size="15">$ neofetch --ascii avatar.jpg</text>

